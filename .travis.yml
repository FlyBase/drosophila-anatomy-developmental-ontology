## STANDBY CI: Travis is DISABLED for this repo. The active CI is GitHub Actions
## (.github/workflows/qc.yml), which runs the same travis_checks goal.
##
## This config is kept so Travis can be switched back on if needed (e.g. if
## GitHub Actions becomes unavailable). To reactivate:
##   1. Go to https://app.travis-ci.com/github/FlyBase/drosophila-anatomy-developmental-ontology/settings
##   2. Under General, turn on "Build pushed branches" and "Build pushed pull requests".
##   3. Check the FlyBase Travis account's plan/credits: open-source builds on
##      travis-ci.com use a credit allowance, so builds may not start without it.
## Travis runs src/ontology/travis.sh, which adds -B (force-rebuild everything).
sudo: required
dist: focal

services:
  - docker

before_install:
  - docker pull obolibrary/odkfull

# command to run tests
script:
  - cd src/ontology
  - travis_wait 60 sleep infinity & sh travis.sh

#after_success:
#  coveralls

# whitelist
branches:
  only:
    - master
    - test-travis


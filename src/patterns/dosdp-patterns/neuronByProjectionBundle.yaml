pattern_name: neuronByProjectionBundle
pattern_iri: http://purl.obolibrary.org/obo/fbbt/src/patterns/dosdp-patterns/neuronByProjectionBundle.yaml
description: "Pattern for generating terms for neurons that fasciculate with a neuron projection bundle (e.g. a nerve, tract, commissure or connective)."

contributors:
  - https://orcid.org/0000-0002-1373-1705

classes:
  neuron: FBbt:00005106
  neuron_projection_bundle: FBbt:00005099

relations:
  fasciculates_with: RO:0002101

annotationProperties:
  database_cross_reference: oboInOwl:hasDbXref

vars:
  neuron: neuron
  bundle: neuron_projection_bundle

name:
  text: "%s of %s"
  vars:
    - neuron
    - bundle

def:
  text: "A(n) %s that fasciculates with a(n) %s."
  vars:
    - neuron
    - bundle
  annotations:
    - annotationProperty: database_cross_reference
      text: "FBC:Autogenerated"

equivalentTo:
  text: "%s that 'fasciculates_with' some %s"
  vars:
    - neuron
    - bundle
